<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="SUS WEARS — campaign: model in a structured overcoat beneath warm studio light">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17130f"/>
      <stop offset="0.5" stop-color="#0e0c0a"/>
      <stop offset="1" stop-color="#0a0908"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.72" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#e8d9b8" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#c2a878" stop-opacity="0.22"/>
